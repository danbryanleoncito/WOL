
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Firebase Connection Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 480px;
      margin: 60px auto;
      padding: 20px;
      background: #f5f7fa;
      color: #222;
    }

    main {
      background: white;
      padding: 24px;
      border-radius: 12px;
    }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 12px;
    }

    button {
      cursor: pointer;
    }

    #status {
      overflow-wrap: anywhere;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Firebase Test</h1>
    <p>Sign in with the dashboard account.</p>

    <form id="loginForm">
      <label for="email">Email address</label>
      <input id="email" type="email" required autocomplete="username">

      <label for="password">Password</label>
      <input id="password" type="password" required
             autocomplete="current-password">

      <button type="submit" id="loginButton">
        Test Firebase Login
      </button>
    </form>

    <p id="status" role="status">Initializing Firebase...</p>
  </main>

  <script type="module">
    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      setPersistence,
      browserSessionPersistence
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

    // Firebase web configuration from your project.
    const firebaseConfig = {
      apiKey: "AIzaSyCLzeA2WT2ebB3d8oXATeoRRejBU_eyxP8",
      authDomain: "esp32-wol-controller.firebaseapp.com",
      databaseURL:
        "https://esp32-wol-controller-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "esp32-wol-controller",
      storageBucket: "esp32-wol-controller.firebasestorage.app",
      messagingSenderId: "614985991917",
      appId: "1:614985991917:web:dc5867145c676c7a692ee4"
    };

    const status = document.getElementById("status");
    const loginButton = document.getElementById("loginButton");

    try {
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      status.textContent =
        "Firebase SDK loaded. Ready to test dashboard login.";

      document.getElementById("loginForm").addEventListener(
        "submit",
        async (event) => {
          event.preventDefault();
          loginButton.disabled = true;
          status.textContent = "Signing in...";

          try {
            await setPersistence(auth, browserSessionPersistence);

            const credential = await signInWithEmailAndPassword(
              auth,
              document.getElementById("email").value.trim(),
              document.getElementById("password").value
            );

            status.textContent =
              "Login successful. Signed-in UID: " + credential.user.uid;
          } catch (error) {
            console.error("Firebase login error:", error);
            status.textContent =
              "Login failed: " + error.code;
          } finally {
            loginButton.disabled = false;
          }
        }
      );
    } catch (error) {
      console.error("Firebase initialization error:", error);
      status.textContent = "Firebase initialization failed. Check the console.";
    }
  </script>
</body>
</html>
